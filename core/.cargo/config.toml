
# The bundled SQLite ships full-text search, R-trees and JSON by default; the store uses none of them.
# JSON has been built in since 3.38, so only SQLITE_OMIT_JSON leaves it out.
[env]
LIBSQLITE3_FLAGS = "-USQLITE_ENABLE_FTS3 -USQLITE_ENABLE_FTS3_PARENTHESIS -USQLITE_ENABLE_FTS5 -USQLITE_ENABLE_RTREE -DSQLITE_OMIT_JSON"
