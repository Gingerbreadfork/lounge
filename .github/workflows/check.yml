name: Check

on:
  push:
  pull_request:

jobs:
  core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The companion crate embeds companion/dist at compile time, so the web app is built first.
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: companion/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: companion
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo test --workspace
        working-directory: core

  plugins:
    name: Plugins and SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins
      - run: cargo test --workspace
        working-directory: plugins
      - run: cargo build --release --target wasm32-unknown-unknown --workspace --exclude lgp-tool --exclude lounge-plugin-sdk
        working-directory: plugins

  companion:
    name: Companion app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: companion/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: companion
      - run: pnpm exec svelte-check --tsconfig ./tsconfig.json
        working-directory: companion
      - run: pnpm build
        working-directory: companion

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: companion/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: companion
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            plugins
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      # Signed with a key made on the spot; only a release needs the real one.
      - run: tools/plugins/build.sh
      - run: ./gradlew :power:testDebugUnitTest :update:testDebugUnitTest :feature:home:testDebugUnitTest :app:assembleRelease
        working-directory: android
      - uses: actions/upload-artifact@v7
        with:
          name: lounge-apk-debug-signed
          path: android/app/build/outputs/apk/release/app-release.apk
