name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    name: Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A tag that is not the app's version would look newer than itself to every TV that installs it.
      - name: Version
        run: |
          TAG=${GITHUB_REF_NAME#v}
          FILE=android/app/build.gradle.kts
          NAME=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' "$FILE")
          CODE=$(sed -n 's/^ *versionCode = \([0-9][0-9]*\)$/\1/p' "$FILE")
          if [ "$NAME" != "$TAG" ]; then
            echo "::error::The tag says $TAG but versionName is $NAME"
            exit 1
          fi
          PREV=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            PREV_CODE=$(git show "$PREV:$FILE" | sed -n 's/^ *versionCode = \([0-9][0-9]*\)$/\1/p')
            if [ -n "$PREV_CODE" ] && [ "$CODE" -le "$PREV_CODE" ]; then
              echo "::error::versionCode $CODE is not above $PREV_CODE from $PREV"
              exit 1
            fi
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: companion/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: companion
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            plugins
      # A release passes the same tests as a change on main before anything is signed. The core
      # embeds the built phone app, so that is built first.
      - run: pnpm exec svelte-check --tsconfig ./tsconfig.json && pnpm build
        working-directory: companion
      - run: cargo test --workspace
        working-directory: core
      - run: cargo test --workspace
        working-directory: plugins
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      # The app's signing key and the plugin publisher key come from repository secrets. A release
      # without them would not install over what TVs have, so it stops here instead.
      - name: Keys
        env:
          KEYSTORE_BASE64: ${{ secrets.LOUNGE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LOUNGE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LOUNGE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LOUNGE_KEY_PASSWORD }}
          PUBLISHER_KEY: ${{ secrets.LOUNGE_PUBLISHER_KEY }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$PUBLISHER_KEY" ]; then
            echo "::error::A release needs LOUNGE_KEYSTORE_BASE64 and LOUNGE_PUBLISHER_KEY"
            exit 1
          fi
          mkdir -p "$HOME/.gradle"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "lounge.storeFile=$RUNNER_TEMP/release.jks"
            echo "lounge.storePassword=$KEYSTORE_PASSWORD"
            echo "lounge.keyAlias=$KEY_ALIAS"
            echo "lounge.keyPassword=$KEY_PASSWORD"
          } >> "$HOME/.gradle/gradle.properties"
          printf '%s' "$PUBLISHER_KEY" > "$RUNNER_TEMP/publisher.key"
      - run: tools/plugins/build.sh
        env:
          LOUNGE_PUBLISHER_KEY: ${{ runner.temp }}/publisher.key
      - run: ./gradlew :power:testDebugUnitTest :update:testDebugUnitTest :feature:home:testDebugUnitTest :app:assembleRelease
        working-directory: android
      # Beside the APK go its baseline profiles, one for each range of Android versions and named
      # for the lowest it serves. A TV that installs one with the APK compiles the app at once.
      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          OUT=android/app/build/outputs/apk/release
          cp "$OUT/app-release.apk" "Lounge-$VERSION.apk"
          jq -r '.baselineProfiles[]? | "\(.minApi) \(.baselineProfiles[0])"' "$OUT/output-metadata.json" | while read -r MIN FILE; do
            cp "$OUT/$FILE" "Lounge-$VERSION.api$MIN.dm"
          done
          if ! ls "Lounge-$VERSION".api*.dm > /dev/null 2>&1; then
            echo "::error::The build made no baseline profile for the release to carry"
            exit 1
          fi
          # A TV takes the profile named for the newest Android not above its own, so the last one
          # has to serve every Android after it.
          if [ "$(jq '[.baselineProfiles[].maxApi] | max' "$OUT/output-metadata.json")" != 2147483647 ]; then
            echo "::error::The newest baseline profile does not cover every later Android"
            exit 1
          fi
          sha256sum "Lounge-$VERSION.apk" "Lounge-$VERSION".api*.dm > SHA256SUMS
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: gh release create "$GITHUB_REF_NAME" "Lounge-$VERSION.apk" "Lounge-$VERSION".api*.dm SHA256SUMS --title "Lounge $VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
