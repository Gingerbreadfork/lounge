[package]
name = "lounge-plugin-homeassistant"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Home Assistant: the lights, scenes, blinds, heating, locks and cameras of the room this TV is in, and of the rest of the home"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lounge-plugin-sdk.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
