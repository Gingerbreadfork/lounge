# First-party plugins and the SDK they are built with. Plugins compile to wasm32-unknown-unknown;
# `lgp-tool` is a native binary that bundles, signs and test-runs them.
[workspace]
resolver = "3"
members = ["sdk", "iptv", "jellyfin", "emby", "plex", "youtube", "archive", "immich", "hdhomerun", "tvheadend", "channels", "nextpvr", "art", "trakt", "kodi", "twitch", "sample", "lgp-tool"]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lounge-plugin-api = { path = "../core/lounge-plugin-api" }
lounge-plugin-sdk = { path = "sdk" }
quick-xml = "0.42"
md-5 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Plugins stay small, but the native runner and its interpreter need full optimisation: at "s"
# wasmi's instruction dispatch overflows the native stack on long plugin calls.
[profile.release.package.lgp-tool]
opt-level = 3

[profile.release.package.wasmi]
opt-level = 3

[profile.release.package.wasmi_core]
opt-level = 3

[profile.release.package.wasmi_ir]
opt-level = 3

[profile.release.package.wasmi_collections]
opt-level = 3
